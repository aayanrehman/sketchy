<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sketchy marketing kit</title>
<!-- One template for every asset. render.ts serves the project root, injects window.KIT (targets, recorded bot rounds, QR)
     and opens kit.html?a=<asset id>. Images and fonts are the game's own files. -->
<style>
@font-face { font-family: Fredoka; font-weight: 500; src: url(/node_modules/@fontsource/fredoka/files/fredoka-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: Fredoka; font-weight: 600; src: url(/node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Fredoka; font-weight: 700; src: url(/node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: Nunito; font-weight: 700; src: url(/node_modules/@fontsource/nunito/files/nunito-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: Nunito; font-weight: 800; src: url(/node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2) format('woff2'); }
@font-face { font-family: Nunito; font-weight: 900; src: url(/node_modules/@fontsource/nunito/files/nunito-latin-900-normal.woff2) format('woff2'); }
:root {
  --ink: #2B2540; --dim: #5A5478; --sky: #BDE4FF; --sky2: #E3F5FF; --hill: #B9F09A; --grass: #A9EC84; --grass2: #7ED35C;
  --yellow: #FFD84D; --pink: #FF7AB0; --blue: #6CC1FF; --lime: #BDF26E; --purple: #B48BFF; --red: #FF5C5C; --orange: #FFB15C;
  --lav: #F3F0FF; --danger: #A52336; --green: #176C3B;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; }
body { font-family: Nunito, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
.fd { font-family: Fredoka, Nunito, sans-serif; }
.stage { position: relative; overflow: hidden; background: linear-gradient(180deg, var(--sky) 0%, var(--sky2) 78%); }
.abs { position: absolute; }
/* scenery (same shapes as the home page sky) */
.sun { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,241,184,.95), rgba(255,216,77,.28) 55%, rgba(255,216,77,0)); pointer-events: none; }
.cloud { position: absolute; fill: #fff; filter: drop-shadow(0 8px 0 rgba(43,37,64,.07)); }
.spark { position: absolute; color: #fff; text-shadow: 0 0 12px rgba(255,216,77,.95), 0 0 3px #FFC83D; line-height: 1; }
.hills { position: absolute; left: 0; bottom: 0; width: 100%; }
.hills svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; display: block; }
/* type */
.logo { font-family: Fredoka; font-weight: 700; color: var(--yellow); line-height: .95; letter-spacing: .015em; white-space: nowrap; }
.h { font-family: Fredoka; font-weight: 700; line-height: 1.02; letter-spacing: -.012em; margin: 0; color: var(--ink); }
.mk { background: linear-gradient(transparent 60%, var(--yellow) 60%, var(--yellow) 90%, transparent 90%); padding: 0 .06em; }
.mk-pink { background: linear-gradient(transparent 60%, #FFB3D1 60%, #FFB3D1 90%, transparent 90%); padding: 0 .06em; }
.mk-blue { background: linear-gradient(transparent 60%, #B5E0FF 60%, #B5E0FF 90%, transparent 90%); padding: 0 .06em; }
.lede { font-weight: 900; line-height: 1.28; margin: 0; }
.eyebrow { display: inline-block; font-family: Fredoka; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; background: var(--ink); color: #fff; border-radius: 999px; }
.kicker { font-weight: 900; letter-spacing: .16em; color: var(--dim); text-transform: uppercase; }
/* stickers */
.card { position: absolute; margin: 0; background: #fff; border: 5px solid var(--ink); border-radius: 26px; box-shadow: 0 10px 0 var(--ink); padding: 10px 10px 0; }
.card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 16px; border: 4px solid var(--ink); display: block; background: var(--lav); }
.card figcaption { text-align: center; font-family: Fredoka; font-weight: 600; padding: 10px 6px 12px; line-height: 1.1; }
.card.imp img { box-shadow: 0 0 0 5px var(--red); }
.card.imp figcaption { color: var(--danger); }
.badge { position: absolute; background: var(--yellow); border: 4px solid var(--ink); border-radius: 999px; font-family: Fredoka; font-weight: 700; box-shadow: 0 5px 0 var(--ink); white-space: nowrap; line-height: 1; }
.badge.white { background: #fff; }
.badge.pink { background: var(--pink); }
.badge.lime { background: var(--lime); }
.erased { position: absolute; left: 50%; background: var(--red); border: 4px solid var(--ink); border-radius: 12px; font-family: Fredoka; font-weight: 700; letter-spacing: .08em; box-shadow: 0 5px 0 var(--ink); line-height: 1; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: .4em; background: #fff; border: 4px solid var(--ink); border-radius: 999px; font-weight: 900; box-shadow: 0 5px 0 var(--ink); white-space: nowrap; line-height: 1; }
.pill.lime { background: var(--lime); } .pill.yellow { background: var(--yellow); } .pill.blue { background: var(--blue); } .pill.pink { background: var(--pink); } .pill.ink { background: var(--ink); color: #fff; }
.box { background: #fff; border: 5px solid var(--ink); border-radius: 28px; box-shadow: 0 10px 0 var(--ink); }
.prompt { position: relative; background: #fff; border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 6px 0 var(--ink); }
.prompt .lab { display: inline-block; background: var(--ink); color: #fff; font-family: Fredoka; font-weight: 600; letter-spacing: .1em; border-radius: 999px; text-transform: uppercase; line-height: 1; }
.prompt .txt { font-weight: 900; line-height: 1.3; }
.num { display: grid; place-items: center; border-radius: 50%; border: 5px solid var(--ink); font-family: Fredoka; font-weight: 700; box-shadow: 0 6px 0 var(--ink); flex: none; }
.mascot { position: absolute; object-fit: contain; }
.arrow { font-family: Fredoka; font-weight: 700; line-height: 1; }
.url { font-family: Fredoka; font-weight: 600; }
/* bars */
.bar { height: 30px; border: 4px solid var(--ink); border-radius: 999px; background: #fff; overflow: hidden; }
.bar i { display: block; height: 100%; border-right: 4px solid var(--ink); }
/* devices */
.laptop { position: absolute; }
.laptop .scr { background: var(--ink); border-radius: 30px; padding: 20px; box-shadow: 0 14px 0 rgba(43,37,64,.18), 0 40px 60px rgba(43,37,64,.18); }
.laptop .scr img { display: block; border-radius: 10px; width: 100%; }
.laptop .base { height: 30px; margin: 0 -70px; background: linear-gradient(#ECEAF5, #CFCBE0); border: 4px solid var(--ink); border-radius: 0 0 26px 26px; position: relative; }
.laptop .base::after { content: ''; position: absolute; left: 50%; top: -4px; width: 180px; height: 12px; transform: translateX(-50%); background: #BDB8D2; border: 4px solid var(--ink); border-top: 0; border-radius: 0 0 12px 12px; }
.phone { position: absolute; background: var(--ink); border-radius: 58px; padding: 14px; box-shadow: 0 14px 0 rgba(43,37,64,.2), 0 40px 60px rgba(43,37,64,.22); }
.phone img { display: block; width: 100%; border-radius: 44px; }
.phone::before { content: ''; position: absolute; left: 50%; top: 24px; width: 92px; height: 26px; transform: translateX(-50%); background: var(--ink); border-radius: 999px; z-index: 2; opacity: .0; }
.blur img { filter: blur(14px) saturate(1.2); transform: scale(1.1); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const K = window.KIT;
const pub = (p) => '/client/public' + p;
const T = Object.fromEntries(K.targets.map((t) => [t.id, t]));
const AREAS = ['subject', 'details', 'style', 'color', 'composition'];
const match = (b) => AREAS.reduce((n, k) => n + Math.max(0, Math.min(20, b[k])), 0); // matchOf without the style-round weights
const TIERS = [{ min: 85, label: 'Gold', medal: '🥇' }, { min: 75, label: 'Silver', medal: '🥈' }, { min: 60, label: 'Bronze', medal: '🥉' }];
const tier = (s) => TIERS.find((t) => s >= t.min);
const words = (s) => s.trim().split(/\s+/).length;
const URL_ = 'sketchy-blue.vercel.app';

// The hero round: frog-band, recorded by the bot Pixel (draft 36 -> final 82) and the bot imposter.
const FROG = T['frog-band'];
const FB = K.demo['frog-band'];
const PIX = FB.artists.find((a) => a.name === 'Pixel');
const DOO = FB.artists.find((a) => a.name === 'Doodle');
const IMP = FB.imposter;
const S = { draft: match(PIX.draft), final: match(PIX.final), doodle: match(DOO.final), impDraft: match(IMP.draft), impFinal: match(IMP.final) };
const img = { target: pub(FROG.image), masked: pub(FROG.masked), draft: pub(PIX.draftImage), final: pub(PIX.finalImage), doodle: pub(DOO.finalImage), impDraft: pub(IMP.draftImage) };
const M = (pose) => pub(`/mascot/${pose}.webp`);

// ---------- building blocks ----------
function outline(r, drop, color = '#2B2540') {
  const out = [];
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * Math.PI * 2, x = (Math.cos(a) * r).toFixed(1), y = Math.sin(a) * r;
    for (const d of [0, drop / 2, drop]) out.push(`${x}px ${(y + d).toFixed(1)}px 0 ${color}`);
  }
  return out.join(',');
}
const logo = (size, extra = '') => `<span class="logo" style="font-size:${size}px;text-shadow:${outline(size * 0.045, size * 0.07)};${extra}">SKETCHY</span>`;
const st = (o) => Object.entries(o).map(([k, v]) => `${k.replace(/[A-Z]/g, (m) => '-' + m.toLowerCase())}:${typeof v === 'number' && !/opacity|z-?index|flex|lineHeight|fontWeight/i.test(k) ? v + 'px' : v}`).join(';');

const CLOUD = '<path d="M30 70 Q8 70 10 52 Q12 36 32 38 Q34 14 62 16 Q80 2 104 14 Q126 4 142 24 Q170 20 174 44 Q194 46 190 62 Q188 72 170 70 Z"/>';
const cloud = (x, y, w, o = 0.95) => `<svg class="cloud" viewBox="0 0 200 80" style="left:${x}px;top:${y}px;width:${w}px;opacity:${o}">${CLOUD}</svg>`;
const spark = (x, y, s) => `<span class="spark" style="left:${x}px;top:${y}px;font-size:${s}px">✦</span>`;
function hills(h, flowers = true) {
  const fl = flowers ? [[170, 214, '#FFFFFF'], [340, 222, '#FF9EC4'], [520, 216, '#FFE066'], [760, 222, '#FFFFFF'], [960, 216, '#FF9EC4'], [1100, 224, '#FFE066']]
    .map(([x, y, c]) => `<g transform="translate(${x} ${y})"><circle r="4.5" fill="${c}"/><circle r="1.8" fill="#FFC83D"/></g>`).join('') : '';
  return `<div class="hills" style="height:${h}px">
  <svg viewBox="0 0 1200 240" preserveAspectRatio="none" style="bottom:${h * 0.16}px;height:85%"><defs><linearGradient id="hf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D6F3C2"/><stop offset="1" stop-color="#BCE9A2"/></linearGradient></defs>
    <path d="M-40 120 C 150 70, 330 72, 480 104 S 780 150, 960 96 S 1160 64, 1240 84 L1240 260 L-40 260 Z" fill="url(#hf)"/><path d="M-40 120 C 150 70, 330 72, 480 104 S 780 150, 960 96 S 1160 64, 1240 84" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="3"/></svg>
  <svg viewBox="0 0 1200 240" preserveAspectRatio="none" style="bottom:${h * 0.04}px"><defs><linearGradient id="hm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BDEFA0"/><stop offset=".6" stop-color="#A2E27F"/><stop offset="1" stop-color="#8FD66B"/></linearGradient></defs>
    <path d="M-40 160 C 160 112, 380 118, 580 150 S 960 182, 1240 128 L1240 260 L-40 260 Z" fill="url(#hm)"/><path d="M-40 160 C 160 112, 380 118, 580 150 S 960 182, 1240 128" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="3"/></svg>
  <svg viewBox="0 0 1200 240" preserveAspectRatio="none"><defs><linearGradient id="hn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ACEB86"/><stop offset=".55" stop-color="#8EDB65"/><stop offset="1" stop-color="#74C952"/></linearGradient></defs>
    <path d="M-40 196 C 220 168, 470 172, 720 192 S 1080 204, 1240 182 L1240 260 L-40 260 Z" fill="url(#hn)"/><path d="M-40 196 C 220 168, 470 172, 720 192 S 1080 204, 1240 182" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="3"/>${fl}</svg>
</div>`;
}
const sun = (x, y, d) => `<div class="sun" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px"></div>`;

/** Sticker card. o: {x,y,w,rot,src,cap,capSize,imp,blur,z} */
function card(o) {
  const cs = o.capSize ?? Math.round(o.w * 0.075 + 4);
  return `<figure class="card ${o.imp ? 'imp' : ''} ${o.blur ? 'blur' : ''}" style="left:${o.x}px;top:${o.y}px;width:${o.w}px;transform:rotate(${o.rot || 0}deg);z-index:${o.z || 1};${o.bw ? `border-width:${o.bw}px;` : ''}${o.pad != null ? `padding:${o.pad}px ${o.pad}px 0;` : ''}${o.style || ''}">
    <div style="position:relative;overflow:hidden;border-radius:16px"><img src="${o.src}" alt=""></div>
    ${o.cap ? `<figcaption style="font-size:${cs}px">${o.cap}</figcaption>` : `<div style="height:${o.pad ?? 10}px"></div>`}
    ${o.inner || ''}</figure>`;
}
const scoreBadge = (s, size, pos) => { const t = tier(s); return `<span class="badge" style="font-size:${size}px;padding:${size * 0.32}px ${size * 0.55}px;${pos}">${s}/100${t ? ` <span style="font-size:.92em">${t.medal}</span> ${t.label}` : ''}</span>`; };
const erased = (size, pos) => `<span class="erased" style="font-size:${size}px;padding:${size * 0.22}px ${size * 0.6}px;${pos}">ERASED</span>`;
const eyebrow = (text, size = 26, extra = '') => `<span class="eyebrow" style="font-size:${size}px;padding:${size * 0.45}px ${size * 0.95}px;${extra}">${text}</span>`;
const promptBox = (o) => `<div class="prompt" style="left:${o.x ?? 0}px;top:${o.y ?? 0}px;width:${o.w}px;padding:${o.pad ?? 22}px;${o.abs === false ? 'position:relative;' : 'position:absolute;'}${o.style || ''}">
  <span class="lab" style="font-size:${o.ls ?? 20}px;padding:${(o.ls ?? 20) * 0.4}px ${(o.ls ?? 20) * 0.8}px">${o.label}</span>
  <div class="txt" style="font-size:${o.size}px;margin-top:${(o.size) * 0.4}px">${o.text}</div></div>`;
const urlPill = (size, pos, cls = '') => `<span class="pill ${cls}" style="font-size:${size}px;padding:${size * 0.5}px ${size * 0.9}px;position:absolute;${pos}"><span class="url">${URL_}</span></span>`;
const mascot = (pose, x, y, w, extra = '') => `<img class="mascot" src="${M(pose)}" style="left:${x}px;top:${y}px;width:${w}px;height:${w}px;${extra}" alt="">`;
const q = (s) => `“${s}”`;

/** Standard explainer/carousel frame: sky, sun, clouds, hills, top brand row, footer URL. */
function frame(W, H, inner, o = {}) {
  const hh = o.hills ?? 230;
  return `<div class="stage" style="width:${W}px;height:${H}px">
    ${sun(W - 520, -260, 820)}
    ${(o.clouds ?? [[-60, 120, 300, .9], [W - 260, 300, 240, .75], [60, H * 0.55, 200, .55]]).map((c) => cloud(...c)).join('')}
    ${(o.sparks ?? [[W * 0.08, H * 0.3, 26], [W * 0.92, H * 0.18, 20], [W * 0.86, H * 0.62, 18]]).map((s) => spark(...s)).join('')}
    ${o.noHills ? '' : hills(hh)}
    ${inner}
  </div>`;
}
/** Header used by the 1080x1350 explainers: brand chip, eyebrow, headline. */
function head(eb, title, o = {}) {
  return `<div class="abs" style="left:72px;top:64px;right:72px;display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:12px"><img src="${M(o.pose || 'happy')}" style="width:76px;height:76px" alt="">${logo(54)}</div>
      ${o.page ? `<span class="pill" style="font-size:26px;padding:12px 22px">${o.page}</span>` : eyebrow(eb, 24)}
    </div>
    ${o.page ? `<div class="abs" style="left:72px;top:178px">${eyebrow(eb, 24)}</div>` : ''}
    <h1 class="h abs" style="left:72px;right:72px;top:${o.page ? 246 : 186}px;font-size:${o.size || 84}px">${title}</h1>`;
}
const footer = (W, H, o = {}) => `<div class="abs" style="left:72px;right:72px;bottom:${o.bottom ?? 54}px;display:flex;justify-content:space-between;align-items:center">
    <span class="pill" style="font-size:30px;padding:16px 28px"><span class="url">${URL_}</span></span>
    <span class="pill ${o.cls || 'lime'}" style="font-size:28px;padding:16px 26px">${o.right || 'Free · no login · phone or laptop'}</span></div>`;

// ---------- banners ----------
const A = {};
const add = (id, w, h, group, title, fn, extra = {}) => (A[id] = { id, w, h, group, title, fn, ...extra });

add('banner-square-1080x1080', 1080, 1080, 'Banners & covers', 'Square post', () => frame(1080, 1080, `
  <div class="abs" style="left:0;right:0;top:58px;text-align:center"><span class="kicker" style="font-size:24px">A little prompting. A lot of accusations.</span></div>
  <div class="abs" style="left:0;right:0;top:104px;display:flex;justify-content:center;align-items:center;gap:14px">
    <img src="${M('happy')}" style="width:150px;height:150px" alt="">${logo(150)}</div>
  ${card({ x: 70, y: 330, w: 330, rot: -6, src: img.target, cap: 'Everyone saw', capSize: 30 })}
  ${card({ x: 375, y: 410, w: 330, rot: 3, src: img.masked, cap: 'The imposter saw', capSize: 30, imp: true, z: 3, inner: erased(30, 'top:-6px;transform:translateX(-50%) rotate(-7deg)') })}
  ${card({ x: 682, y: 330, w: 330, rot: 5, src: img.final, cap: 'A player’s prompt', capSize: 30, z: 2, inner: scoreBadge(S.final, 30, 'right:-26px;top:-28px;transform:rotate(6deg)') })}
  <div class="abs" style="left:0;right:0;top:870px;text-align:center"><p class="lede" style="font-size:38px">Recreate the picture with an AI prompt.<br>One of you can’t see all of it. <span class="mk">Find them.</span></p></div>
  ${urlPill(28, 'left:50%;bottom:34px;transform:translateX(-50%)')}
`, { hills: 150, clouds: [[-70, 140, 280, .9], [860, 200, 240, .8], [930, 640, 160, .6]] }));

add('banner-portrait-1080x1350', 1080, 1350, 'Banners & covers', 'Portrait post', () => frame(1080, 1350, `
  <div class="abs" style="left:76px;top:70px"><span class="kicker" style="font-size:24px">A little prompting. A lot of accusations.</span></div>
  <div class="abs" style="left:58px;top:110px;display:flex;align-items:center;gap:10px"><img src="${M('happy')}" style="width:150px;height:150px" alt="">${logo(146)}</div>
  <p class="lede abs" style="left:76px;top:292px;font-size:42px">Recreate the picture with an AI prompt.<br>One of you can’t see all of it. <span class="mk">Find them.</span></p>
  ${card({ x: 300, y: 450, w: 480, rot: -3, src: img.target, cap: 'The target', capSize: 34, z: 1 })}
  ${card({ x: 46, y: 760, w: 330, rot: -7, src: img.masked, cap: 'The imposter saw', capSize: 29, imp: true, z: 3, inner: erased(30, 'top:-8px;transform:translateX(-50%) rotate(-8deg)') })}
  ${card({ x: 700, y: 740, w: 330, rot: 6, src: img.final, cap: 'Prompt → AI image', capSize: 29, z: 2, inner: scoreBadge(S.final, 30, 'left:-30px;top:-30px;transform:rotate(-6deg)') })}
  <div class="abs" style="left:0;right:0;bottom:118px;display:flex;justify-content:center;gap:16px">
    <span class="pill" style="font-size:28px;padding:15px 24px">2–8 players · bots fill empty seats</span></div>
  ${urlPill(30, 'left:50%;bottom:34px;transform:translateX(-50%)', 'lime')}
`, { hills: 220, clouds: [[700, 120, 300, .85], [-80, 520, 220, .7], [880, 420, 180, .6]] }));

add('banner-story-1080x1920', 1080, 1920, 'Banners & covers', 'Story (9:16)', () => frame(1080, 1920, `
  <div class="abs" style="left:0;right:0;top:250px;display:flex;flex-direction:column;align-items:center;gap:6px">
    <span class="kicker" style="font-size:26px">A little prompting. A lot of accusations.</span>
    <div style="display:flex;align-items:center;gap:12px;margin-top:10px"><img src="${M('happy')}" style="width:160px;height:160px" alt="">${logo(160)}</div></div>
  ${card({ x: 70, y: 560, w: 470, rot: -5, src: img.target, cap: 'Everyone sees this', capSize: 34, z: 1 })}
  ${card({ x: 540, y: 620, w: 470, rot: 5, src: img.masked, cap: 'One of you sees this', capSize: 34, imp: true, z: 2, inner: erased(36, 'top:-10px;transform:translateX(-50%) rotate(-7deg)') })}
  ${mascot('sus', 70, 1190, 270, 'transform:rotate(-4deg)')}
  <h2 class="h abs" style="left:360px;top:1240px;font-size:78px">Write the prompt.<br><span class="mk">Find the imposter.</span></h2>
  ${urlPill(34, 'left:50%;top:1500px;transform:translateX(-50%)', 'lime')}
`, { hills: 300, clouds: [[-60, 120, 320, .85], [760, 180, 260, .75], [880, 1130, 200, .6], [-40, 1060, 180, .5]] }));

add('header-x-1500x500', 1500, 500, 'Banners & covers', 'X / Twitter header', () => frame(1500, 500, `
  <div class="abs" style="left:300px;top:96px">
    <span class="kicker" style="font-size:19px">A little prompting. A lot of accusations.</span>
    <div style="display:flex;align-items:center;gap:8px;margin-top:8px"><img src="${M('happy')}" style="width:112px;height:112px" alt="">${logo(108)}</div>
    <p class="lede" style="font-size:27px;margin-top:16px">Recreate the picture with an AI prompt.<br>One of you can’t see all of it. Find them.</p>
  </div>
  ${card({ x: 930, y: 70, w: 220, rot: -6, src: img.target, cap: 'Target', capSize: 22, pad: 8 })}
  ${card({ x: 1170, y: 64, w: 220, rot: 5, src: img.final, cap: 'A player’s prompt', capSize: 21, pad: 8, z: 2, inner: scoreBadge(S.final, 21, 'right:-20px;top:-22px;transform:rotate(6deg)') })}

// ---------- targets poster ----------
function poster(Wp, Hp, o) {
  const list = K.targets; const n = list.length;
  const top = o.top, side = o.side, bottom = o.bottom, gap = o.gap;
  const aw = Wp - side * 2, ah = Hp - top - bottom;
  let best = null; // pick the column count that gives the biggest tiles
  for (let c = 3; c <= 14; c++) { const r = Math.ceil(n / c); const s = Math.min((aw - gap * (c - 1)) / c, (ah - gap * (r - 1)) / r); if (!best || s > best.s) best = { c, r, s }; }
  const s = Math.floor(best.s);
  const gw = best.c * s + gap * (best.c - 1), gh = best.r * s + gap * (best.r - 1);
  const x0 = (Wp - gw) / 2, y0 = top + (ah - gh) / 2;
  const last = n % best.c, lastRow = Math.floor((n - 1) / best.c);
  const tiles = list.map((t, i) => { const r = Math.floor(i / best.c); const c = (i % best.c) + (last && r === lastRow ? (best.c - last) / 2 : 0); const rot = [-3, 2, -1.5, 3, -2.5, 1.5][(i * 7) % 6];
    return `<div style="position:absolute;left:${x0 + c * (s + gap)}px;top:${y0 + r * (s + gap)}px;width:${s}px;height:${s}px;transform:rotate(${rot}deg);background:#fff;border:${o.bw}px solid var(--ink);border-radius:${s * 0.12}px;padding:${o.pad}px;box-shadow:0 ${o.bw + 2}px 0 var(--ink)"><img src="${pub(t.image)}" style="width:100%;height:100%;object-fit:cover;border-radius:${s * 0.08}px;display:block" alt=""></div>`; }).join('');
  return frame(Wp, Hp, o.header(n) + tiles, { noHills: true, clouds: o.clouds, sparks: [] });
}

const TILE = { 'howto-1': 296 / 334, 'howto-2': 302 / 338, 'howto-3': 280 / 346 }; // height / width of the how-to tiles

  const sz = 436, off = (512 - sz) / 2;
  return `<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" style="display:block">
    <defs><filter id="die" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="14" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.2" result="db"/><feComponentTransfer in="db" result="dm"><feFuncA type="linear" slope="3" intercept="-0.6"/></feComponentTransfer>
      <feOffset in="dm" dy="7" result="so"/><feFlood flood-color="#2B2540" flood-opacity=".22"/><feComposite in2="so" operator="in" result="shadow"/>
      <feMorphology in="dm" operator="dilate" radius="1.5" result="dm2"/><feFlood flood-color="#2B2540" flood-opacity=".18"/><feComposite in2="dm2" operator="in" result="rim"/>
      <feFlood flood-color="#FFFFFF"/><feComposite in2="dm" operator="in" result="white"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="rim"/><feMergeNode in="white"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    ${TILE[p] ? (() => { const h = Math.round(sz * TILE[p]), y = (512 - h) / 2 - 6, i = 7; // how-to art is a rounded tile: clip off its square corners
      return `<clipPath id="rc"><rect x="${off + i}" y="${y + i}" width="${sz - 2 * i}" height="${h - 2 * i}" rx="54"/></clipPath><g filter="url(#die)"><g clip-path="url(#rc)"><image href="${M(p)}" x="${off}" y="${y}" width="${sz}" height="${h}" preserveAspectRatio="none"/></g></g>`; })()
      : `<image filter="url(#die)" href="${M(p)}" x="${off}" y="${off - 6}" width="${sz}" height="${sz}" preserveAspectRatio="xMidYMid meet"/>`}</svg>`;
}, { transparent: true });
