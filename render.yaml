# Render blueprint: one web service with WebSockets. Set OPENAI_API_KEY in the dashboard.
services:
  - type: web
    name: sketchy
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1-mini
      - key: OPENAI_IMAGE_QUALITY
        value: low
      - key: OPENAI_JUDGE_MODEL
        value: gpt-4.1-mini
      - key: STUDIO_KEY
        sync: false
