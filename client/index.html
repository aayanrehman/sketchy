    <title>Sketchy</title>
    <meta name="description" content="A party game where you recreate pictures with AI prompts. One player can’t see the whole picture. Find them, and get better at prompting." />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sketchy" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sketchy — one of you can’t see the whole picture" />
    <meta property="og:description" content="A party game where you recreate pictures with AI prompts. Find the imposter, beat the judge. 4–8 players, no login, any phone." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="/og.png" />
    <link rel="preload" as="image" href="/mascot/happy.webp" />
    <link rel="preload" as="image" href="/mascot/think.webp" />
    <style>
      /* Instant splash: painted before any JS loads, faded out by main.tsx once fonts and the app are ready. */
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: linear-gradient(180deg, #BDE4FF 0%, #E3F5FF 75%); transition: opacity .45s ease, visibility .45s; }
      #splash.out { opacity: 0; visibility: hidden; }
      #splash .s-in { display: grid; justify-items: center; gap: 18px; animation: s-rise .6s cubic-bezier(.2,0,0,1) both; }
      #splash img { width: 132px; height: 132px; animation: s-bob 1.6s ease-in-out infinite; }
      #splash .s-dots { display: flex; gap: 8px; }
      #splash .s-dots i { width: 10px; height: 10px; border-radius: 50%; background: #2B2540; opacity: .25; animation: s-dot 1.2s ease-in-out infinite; }
      #splash .s-dots i:nth-child(2) { animation-delay: .15s; } #splash .s-dots i:nth-child(3) { animation-delay: .3s; }
      @keyframes s-bob { 50% { transform: translateY(-8px) rotate(-3deg); } }
      @keyframes s-dot { 40% { opacity: 1; transform: translateY(-4px); } }
      @keyframes s-rise { from { opacity: 0; transform: translateY(10px); } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation: none !important; transition: opacity .2s; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><div class="s-in"><img src="/mascot/happy.webp" alt="" /><div class="s-dots"><i></i><i></i><i></i></div></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
