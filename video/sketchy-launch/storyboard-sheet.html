<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700&display=swap');
body{margin:0;background:#cfe9ff;font-family:Nunito,sans-serif;color:#2a2440;padding:36px;width:2328px}
h1{font-family:Fredoka;font-size:44px;margin:0 0 6px}
.sub{margin:0 0 24px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.c{background:#fff;border:4px solid #2a2440;border-radius:20px;overflow:hidden;box-shadow:0 5px 0 #2a2440}
.c .im{height:300px;background:#e8f4ff;display:flex;gap:6px;align-items:center;justify-content:center;overflow:hidden}
.c .im img{height:100%;object-fit:cover;min-width:0}
.c .t{padding:12px 16px 16px}
.h{display:flex;justify-content:space-between;font-family:Fredoka;font-weight:600;font-size:22px}
.d{background:#ffd84a;border:3px solid #2a2440;border-radius:999px;padding:0 10px;font-size:16px}
.s{font-size:15px;margin:6px 0;line-height:1.3}
.cap{font-size:15px;background:#f3efff;border-radius:10px;padding:8px 10px;line-height:1.35}
.cap b{font-family:Fredoka;font-weight:600}
</style></head><body>
<h1>Sketchy launch video — storyboard (≈85 s, 1920×1080)</h1>
<p class="sub">Every gameplay shot is real footage from sketchy-blue.vercel.app (solo demo vs. 3 bots + host/phone join). Frames 1, 8, 14 are motion graphics built from the game's own assets. Captions burned in; the game's own lofi music underneath.</p>
<div class="grid" id="g"></div>
<script>
const R='../raw/', D=R+'demo-desktop/shots/', T='../../client/public/targets/', M='../../client/public/mascot/';
const F=[
['1 · Hook','5s',[T+'frog-band.webp',T+'frog-band-masked.webp'],'Target frog fills the frame, then its drum kit blurs into the imposter version; logo + mascot pop.','Recreate the picture with an AI prompt. / One of you can’t see all of it.'],
['2 · Join','9s',[R+'join-host/shots/002-host-4-joined.png',R+'join-phone/shots/001-phone-joined.png'],'Host TV (room code + QR + URL) beside a phone typing the code; players pop into the lobby.','One screen hosts. Everyone joins on their own phone. / Room code or QR. No login. No install.'],
['3 · Study','4s',[D+'003-r1-PROMPT-hold.png'],'Round 1: “Study your target”, slow push-in.','Everyone studies the same target picture.'],
['4 · Quick draft','5s',[D+'007-r1-DRAFT-hold.png'],'Typing the 8-word draft, lock in.','Write a quick draft. 8 words, max.'],
['5 · AI feedback','7s',[D+'010-feedback-visible.png'],'Draft image returns: 34/100, Missed + Tip. Zoom on the card.','The AI draws your prompt, scores it, and tells you what it missed.'],
['6 · Refine','5s',[D+'011-r1-REFINE-hold.png'],'Typing the refinement; everyone’s drafts row (one frog has a guitar…).','Refine it, up to 30 words. Only the final image is scored.'],
['7 · Reveal','5s',[D+'013-r1-GALLERY-hold.png'],'Final images paint in, drafts in the corners.','Final images paint in, each with its draft in the corner.'],
['8 · The twist','6s',[T+'frog-band.webp',T+'frog-band-masked.webp',T+'frog-band-bot-imposter-draft.webp'],'Explainer: “Everyone saw” vs “The imposter saw”, then the imposter’s real draft: “frog playing guitar”.','The twist: one player’s picture had the key detail blurred. / They have to guess what’s there, and blend in.'],
['9 · Hint & discuss','5s',[D+'015-hint-visible.png'],'Zoom on chat: Sketchy’s AI hint + accusations.','Sketchy, the AI host, drops one hint. Then everyone argues it out.'],
['10 · Vote → caught → steal','8s',[D+'021-r1-UNMASK-hold.png',D+'024-r1-STEAL-hold.png'],'Vote, IMPOSTER! stamp, then the 4-option steal.','Vote for the imposter. / Caught! But they get one guess to steal the round.'],
['11 · Learning moment','8s',[D+'027-verdict-scrolled.png'],'Original prompt behind the target, 5-area bars, “draft 34 → final 74 (+40)”.','Then see the real prompt behind the picture… / …and a 5-area score. Draft 34 → final 74. You get better every round.'],
['12 · Your turn to bluff','4s',[D+'032-r2-PROMPT.png'],'Round 2 as the imposter: cat with the turntable hidden, Taboo words.','Next round, you might be the one bluffing.'],
['13 · Payoff','7s',[D+'071-final-settled.png',D+'073-share-dialog.png'],'Podium + awards → highlight reel → share card.','Awards, a highlight reel, and a result card to share.'],
['14 · End card','7s',[M+'happy.webp'],'Sky + hills, waving mascot, logo, URL pill, requirement chips.','Play free at sketchy-blue.vercel.app / 4–8 players · no login · phone or laptop · new picture every round'],
];
g.innerHTML=F.map(([n,d,ims,s,c])=>`<div class="c"><div class="im">${ims.map(i=>`<img src="${i}">`).join('')}</div><div class="t"><div class="h"><span>${n}</span><span class="d">${d}</span></div><p class="s">${s}</p><div class="cap"><b>Captions:</b> ${c}</div></div></div>`).join('');
</script></body></html>
